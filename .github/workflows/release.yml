name: Test, Build & Release

# Version tags publish a GitHub Release. Manual runs build downloadable
# artifacts without publishing a release.
on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version number
        id: version
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${{ github.ref_name }}"
          else
            base=$(python -c "import re; text=open('pyproject.toml').read(); match=re.search(r'^version\s*=\s*\"(\d+)\.(\d+)', text, re.M); print(match.group(1)+'.'+match.group(2))")
            version="v${base}.$(git rev-list --count HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          printf 'VERSION = "%s"\n' "$version" > src/sim_controls_manager/_buildinfo.py
          echo "Building $version"

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,build]"

      - name: Run tests
        run: python -m pytest

      - name: Build the executable
        run: >
          python -m PyInstaller --noconfirm --clean
          --onefile --console
          --name SimControlsManager
          --paths src
          packaging/launcher.py

      - name: Smoke-test the executable
        shell: pwsh
        run: |
          & "dist/SimControlsManager.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "dist/SimControlsManager.exe" catalog validate "examples/catalog.example.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $exe = "dist/SimControlsManager.exe"
          (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower() + "  SimControlsManager.exe" `
            | Out-File -Encoding ascii "dist/SimControlsManager.exe.sha256"

      - name: Write release notes
        id: notes
        if: github.ref_type == 'tag'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -n "$previous" ]; then range="$previous..HEAD"; else range="HEAD"; fi
          {
            echo "notes<<NOTES_EOF"
            echo "### What's new in $VERSION"
            echo ""
            git log "$range" --no-merges --pretty=format:'- %s' | head -15
            echo ""
            echo ""
            echo "_Automated Windows build from commit \`${GITHUB_SHA::7}\`._"
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimControlsManager
          path: |
            dist/SimControlsManager.exe
            dist/SimControlsManager.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          fail_on_unmatched_files: true
          files: |
            dist/SimControlsManager.exe
            dist/SimControlsManager.exe.sha256
