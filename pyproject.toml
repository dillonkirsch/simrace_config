[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sim-controls-manager"
version = "0.1.0"
description = "Safe, preview-first management of racing simulator button bindings."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
simcontrols = "sim_controls_manager.cli:main"

[project.gui-scripts]
simcontrols-gui = "sim_controls_manager.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
